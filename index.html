<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المهام - جامعة الأقصى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #111827; }
        .glass { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(55, 65, 81, 0.5); }
    </style>
</head>
<body class="text-gray-100 p-4 md:p-8 max-w-4xl mx-auto min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-blue-400">مساء الخير، حسام</h1>
            <p class="text-gray-400 text-sm mt-1">إليك المواعيد النهائية لتكليفاتك وامتحاناتك</p>
        </div>
        <div class="text-left">
            <span class="bg-gray-800 text-xs px-2 py-1 rounded border border-gray-700">تحديث تلقائي مفعل 🟢</span>
        </div>
    </header>

    <!-- Stats -->
    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="glass p-4 rounded-xl text-center">
            <h3 class="text-gray-400 text-sm">التكليفات المفتوحة</h3>
            <p class="text-3xl font-bold text-red-400 mt-1" id="task-count">0</p>
        </div>
        <div class="glass p-4 rounded-xl text-center">
            <h3 class="text-gray-400 text-sm">الامتحانات القادمة</h3>
            <p class="text-3xl font-bold text-green-400 mt-1" id="exam-count">0</p>
        </div>
    </div>

    <!-- Active Deadlines -->
    <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">المواعيد النهائية (تحديث حي من المودل)</h2>
    <div id="tasks-container" class="space-y-4 mb-10 flex-1">
        <p class="text-gray-400 text-sm">جاري سحب البيانات من الخادم السحابي...</p>
    </div>

    <!-- Script for ICS Parsing and Countdown -->
    <script>
        async function fetchICS() {
            try {
                const response = await fetch('moodle_data.ics');
                if(!response.ok) throw new Error("No data");
                const data = await response.text();
                parseICS(data);
            } catch (err) {
                document.getElementById('tasks-container').innerHTML = '<p class="text-yellow-400 text-sm">بانتظار وصول مهام المودل من الأتمتة السحابية...</p>';
            }
        }

        function parseICS(icsData) {
            const events = [];
            const lines = icsData.split(/\r?\n/);
            let currentEvent = null;

            lines.forEach(line => {
                if (line.startsWith('BEGIN:VEVENT')) currentEvent = {};
                else if (line.startsWith('END:VEVENT')) {
                    if (currentEvent) events.push(currentEvent);
                    currentEvent = null;
                }
                else if (currentEvent) {
                    if (line.startsWith('SUMMARY:')) currentEvent.summary = line.substring(8).trim();
                    if (line.startsWith('DTSTART:')) currentEvent.start = parseICSDate(line.substring(8).trim());
                }
            });

            renderEvents(events);
        }

        function parseICSDate(dateStr) {
            const year = dateStr.substring(0,4);
            const month = dateStr.substring(4,6) - 1;
            const day = dateStr.substring(6,8);
            const hour = dateStr.substring(9,11);
            const min = dateStr.substring(11,13);
            return new Date(Date.UTC(year, month, day, hour, min));
        }

        function renderEvents(events) {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';
            
            const futureEvents = events.filter(e => e.start > new Date()).sort((a,b) => a.start - b.start);
            let tasks = 0, exams = 0;

            if(futureEvents.length === 0) {
                container.innerHTML = '<div class="glass p-6 rounded-xl text-center"><p class="text-green-400 text-lg font-bold">لا يوجد مهام أو امتحانات قادمة!</p><p class="text-gray-400 text-sm mt-2">استمتع بوقتك، النظام يراقب المودل نيابة عنك وسيبلغك بأي جديد.</p></div>';
                return;
            }

            futureEvents.forEach(e => {
                const isExam = e.summary.toLowerCase().includes('quiz') || e.summary.toLowerCase().includes('exam') || e.summary.includes('امتحان') || e.summary.includes('اختبار');
                if(isExam) exams++; else tasks++;

                const now = new Date();
                const diff = e.start - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

                let timeColor = days <= 2 ? 'text-red-400' : 'text-gray-300';
                let typeColor = isExam ? 'border-green-600' : 'border-blue-600';

                const div = document.createElement('div');
                div.className = `glass p-4 rounded-xl border-r-4 ${typeColor} flex justify-between items-center`;
                div.innerHTML = `
                    <div class="pr-2">
                        <p class="font-bold text-sm text-gray-100">${e.summary}</p>
                        <p class="text-xs text-gray-400 mt-1">${e.start.toLocaleString('ar-EG')}</p>
                    </div>
                    <div class="text-center bg-gray-800 px-3 py-1 rounded min-w-[80px]">
                        <span class="block text-lg font-bold ${timeColor}">${days}d ${hours}h</span>
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('task-count').innerText = tasks;
            document.getElementById('exam-count').innerText = exams;
        }

        fetchICS();
    </script>
</body>
</html>
