<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Aqsa University | Task Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-arabic { font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-100 p-4 md:p-8 max-w-6xl mx-auto min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-6">
        <div>
            <h1 class="text-3xl font-bold text-blue-400 tracking-tight">Welcome back, ALHUS</h1>
            <p class="text-slate-400 text-sm mt-1">Here is the automated overview of your deadlines and exams.</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="bg-slate-800/80 text-xs px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Auto-Sync Active
            </span>
        </div>
    </header>

    <!-- Overview Stats -->
    <div class="grid grid-cols-2 gap-4 md:gap-6 mb-8">
        <div class="glass p-5 rounded-2xl flex items-center justify-between">
            <div>
                <h3 class="text-slate-400 text-sm font-semibold uppercase tracking-wider">Pending Assignments</h3>
                <p class="text-3xl font-bold text-blue-400 mt-2" id="task-count">0</p>
            </div>
            <div class="text-4xl opacity-20">📝</div>
        </div>
        <div class="glass p-5 rounded-2xl flex items-center justify-between">
            <div>
                <h3 class="text-slate-400 text-sm font-semibold uppercase tracking-wider">Upcoming Exams</h3>
                <p class="text-3xl font-bold text-emerald-400 mt-2" id="exam-count">0</p>
            </div>
            <div class="text-4xl opacity-20">⚡</div>
        </div>
    </div>

    <!-- Main Content: Split View -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 flex-1">
        
        <!-- Assignments Column -->
        <section class="flex flex-col">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-xl">📝</span>
                <h2 class="text-xl font-bold text-slate-200">Assignments & Tasks</h2>
            </div>
            <div id="assignments-container" class="space-y-4 flex-1">
                <p class="text-slate-400 text-sm">Fetching data from cloud server...</p>
            </div>
        </section>

        <!-- Quizzes Column -->
        <section class="flex flex-col">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-xl">⚡</span>
                <h2 class="text-xl font-bold text-slate-200">Quizzes & Exams</h2>
            </div>
            <div id="quizzes-container" class="space-y-4 flex-1">
                <p class="text-slate-400 text-sm">Fetching data from cloud server...</p>
            </div>
        </section>

    </div>

    <!-- Script for ICS Parsing, UI Separation and Task Checking -->
    <script>
        const cacheBuster = '?t=' + new Date().getTime();

        async function fetchICS() {
            try {
                const response = await fetch('moodle_data.ics' + cacheBuster);
                if(!response.ok) throw new Error("No data");
                const data = await response.text();
                parseICS(data);
            } catch (err) {
                const errorHtml = '<p class="text-amber-400 text-sm glass p-4 rounded-lg">Waiting for automated sync to complete...</p>';
                document.getElementById('assignments-container').innerHTML = errorHtml;
                document.getElementById('quizzes-container').innerHTML = errorHtml;
            }
        }

        function parseICS(icsData) {
            const events = [];
            const lines = icsData.split(/\r?\n/);
            let currentEvent = null;

            lines.forEach(line => {
                if (line.startsWith('BEGIN:VEVENT')) {
                    currentEvent = {};
                }
                else if (line.startsWith('END:VEVENT')) {
                    if (currentEvent) events.push(currentEvent);
                    currentEvent = null;
                }
                else if (currentEvent) {
                    if (line.startsWith('SUMMARY:')) { 
                        currentEvent.summary = line.substring(8).trim(); 
                    } 
                    else if (line.startsWith('DTSTART:')) { 
                        currentEvent.start = parseICSDate(line.substring(8).trim()); 
                    } 
                    else if (line.startsWith('CATEGORIES:')) { 
                        currentEvent.course = line.substring(11).trim(); 
                    } 
                }
            });

            renderEvents(events);
        }

        function parseICSDate(dateStr) {
            const year = dateStr.substring(0,4);
            const month = dateStr.substring(4,6) - 1;
            const day = dateStr.substring(6,8);
            const hour = dateStr.substring(9,11);
            const min = dateStr.substring(11,13);
            return new Date(Date.UTC(year, month, day, hour, min));
        }

        window.toggleTask = function(id, btnElement) {
            const titleEl = document.getElementById('title_' + id);
            const isDone = localStorage.getItem('done_' + id) === 'true';
            
            if (isDone) {
                localStorage.setItem('done_' + id, 'false');
                btnElement.className = 'shrink-0 w-7 h-7 rounded-full border flex items-center justify-center transition-colors cursor-pointer bg-slate-700 text-slate-300 border-slate-600 hover:bg-slate-600';
                titleEl.className = 'font-bold text-sm truncate transition-all text-slate-100 font-arabic';
            } else {
                localStorage.setItem('done_' + id, 'true');
                btnElement.className = 'shrink-0 w-7 h-7 rounded-full border flex items-center justify-center transition-colors cursor-pointer bg-emerald-600 text-white border-emerald-500';
                titleEl.className = 'font-bold text-sm truncate transition-all line-through text-slate-500 opacity-60 font-arabic';
            }
        };

        function renderEvents(events) {
            const assignContainer = document.getElementById('assignments-container');
            const quizContainer = document.getElementById('quizzes-container');
            assignContainer.innerHTML = '';
            quizContainer.innerHTML = '';
            
            const futureEvents = events.filter(e => e.start > new Date()).sort((a,b) => a.start - b.start);
            let tasksCount = 0, examsCount = 0;

            const emptyStateHtml = (message) => `
                <div class="glass p-6 rounded-xl text-center h-full flex flex-col justify-center border-dashed border-slate-600">
                    <span class="text-3xl mb-2 opacity-50">✨</span>
                    <p class="text-slate-300 font-semibold">${message}</p>
                    <p class="text-slate-500 text-xs mt-1">System is actively monitoring.</p>
                </div>
            `;

            futureEvents.forEach(e => {
                const summaryLower = e.summary.toLowerCase();
                const isExam = summaryLower.includes('quiz') || summaryLower.includes('exam') || summaryLower.includes('midterm') || e.summary.includes('امتحان') || e.summary.includes('اختبار');
                
                const now = new Date();
                const diff = e.start - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

                const isUrgent = days <= 2;
                const timeBadgeColor = isUrgent ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-slate-800 text-slate-300 border-slate-700';
                const cardAccent = isExam ? 'border-l-emerald-500' : 'border-l-blue-500';
                const formattedDate = e.start.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

                let courseName = e.course || 'مهمة جامعية';
                courseName = courseName.replace(/^[\d\s_.\-]+/, '').replace(/[_\-\s\d]+$/, '').trim();

                const uniqueId = btoa(unescape(encodeURIComponent(e.summary + e.start.getTime()))).replace(/[^a-zA-Z0-9]/g, '');
                const isTaskDone = localStorage.getItem('done_' + uniqueId) === 'true';
                
                const btnClasses = isTaskDone ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-700 text-slate-300 border-slate-600 hover:bg-slate-600';
                const titleClasses = isTaskDone ? 'line-through text-slate-500 opacity-60' : 'text-slate-100';

                const cardHtml = `
                    <div class="glass p-4 rounded-xl border-l-4 ${cardAccent} hover:bg-slate-800/50 transition-colors flex justify-between items-center gap-3">
                        <button onclick="toggleTask('${uniqueId}', this)" class="shrink-0 w-7 h-7 rounded-full border flex items-center justify-center transition-colors cursor-pointer ${btnClasses}">
                            <span class="text-xs">✔</span>
                        </button>
                        <div class="flex-1 min-w-0">
                            <span class="bg-slate-800 text-blue-300 font-arabic text-[10px] px-2 py-0.5 rounded border border-slate-700 inline-block mb-1.5 truncate max-w-full" dir="rtl" title="${courseName}">
                                📘 ${courseName}
                            </span>
                            <p id="title_${uniqueId}" class="font-bold font-arabic text-sm truncate transition-all ${titleClasses}" title="${e.summary}" dir="auto">${e.summary}</p>
                            <p class="text-xs text-slate-400 mt-1 flex items-center gap-1">
                                📅 ${formattedDate}
                            </p>
                        </div>
                        <div class="text-center px-3 py-1.5 rounded-lg border ${timeBadgeColor} min-w-[80px] shrink-0">
                            <span class="block text-sm font-bold">${days}d ${hours}h</span>
                        </div>
                    </div>
                `;

                if(isExam) {
                    quizContainer.insertAdjacentHTML('beforeend', cardHtml);
                    examsCount++;
                } else {
                    assignContainer.insertAdjacentHTML('beforeend', cardHtml);
                    tasksCount++;
                }
            });

            if(tasksCount === 0) assignContainer.innerHTML = emptyStateHtml("No pending assignments");
            if(examsCount === 0) quizContainer.innerHTML = emptyStateHtml("No upcoming quizzes");

            document.getElementById('task-count').innerText = tasksCount;
            document.getElementById('exam-count').innerText = examsCount;
        }

        fetchICS();
    </script>
</body>
</html>
